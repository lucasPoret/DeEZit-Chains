<VirtualHost *:80>
    # Pointer directement vers le dossier php pour simuler MAMP
    DocumentRoot /var/www/html/php
    ServerName localhost

    # Passer les variables d'environnement à PHP
    PassEnv DB_HOST DB_USER DB_PASSWORD DB_NAME

    <Directory /var/www/html/php>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Permettre l'accès aux fichiers statiques depuis la racine
    Alias /css /var/www/html/css
    <Directory /var/www/html/css>
        Options Indexes FollowSymLinks
        Require all granted
    </Directory>

    Alias /js /var/www/html/js
    <Directory /var/www/html/js>
        Options Indexes FollowSymLinks
        Require all granted
    </Directory>

    Alias /image /var/www/html/image
    <Directory /var/www/html/image>
        Options Indexes FollowSymLinks
        Require all granted
    </Directory>

    Alias /sound /var/www/html/sound
    <Directory /var/www/html/sound>
        Options Indexes FollowSymLinks
        Require all granted
    </Directory>

    Alias /favicon /var/www/html/favicon
    <Directory /var/www/html/favicon>
        Options Indexes FollowSymLinks
        Require all granted
    </Directory>

    Alias /json /var/www/html/json
    <Directory /var/www/html/json>
        Options Indexes FollowSymLinks
        Require all granted
    </Directory>

    Alias /tuto /var/www/html/tuto
    <Directory /var/www/html/tuto>
        Options Indexes FollowSymLinks
        Require all granted
    </Directory>

    Alias /font /var/www/html/font
    <Directory /var/www/html/font>
        Options Indexes FollowSymLinks
        Require all granted
    </Directory>

    # Redirection vers index.php par défaut
    DirectoryIndex index.php index.html

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

